<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PetAdopt 🐾 | PetVora</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#f2f7ff;--card:#ffffff;--line:#d6e2f5;--gold:#1a56db;--gold2:#0b2a6b;--cream:#0f2252;--mut:#5f7396;--ok:#0f9d78;--bad:#d9534f;--teal:#19c7b5;--grad:linear-gradient(135deg,#1a56db,#19c7b5)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:#d9e6f7}
body{font-family:'Jost',sans-serif;color:var(--cream);background:var(--ink);max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:130px;font-weight:400}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;font-weight:700}
header{display:flex;align-items:center;gap:12px;padding:16px 18px;background:transparent}
.logo{width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);background:#fff center/cover;display:grid;place-items:center;font-size:20px;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
header h1{font-size:26px;color:var(--gold2);line-height:1}
header small{color:var(--mut);letter-spacing:2px;font-size:10px;text-transform:uppercase}
main{padding:18px}
.hero{background:linear-gradient(135deg,#0b2a6b,#1a56db 60%,#19c7b5);border-radius:22px;box-shadow:0 10px 26px rgba(26,86,219,.25);padding:20px;margin-bottom:16px}
.hero h2{font-size:30px;color:#fff;line-height:1.1}.hero p{color:#d6e8ff;font-size:14px;margin-top:8px}
.flow{display:flex;gap:6px;overflow-x:auto;margin:14px 0 0;font-size:11px;color:#fff}
.flow span{white-space:nowrap;border:1px solid rgba(255,255,255,.5);padding:4px 9px;border-radius:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--cream);border-radius:22px;padding:8px 14px;font:500 14px 'Jost';white-space:nowrap}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.fbtn{width:100%;margin-bottom:12px}
.filters{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;background:var(--card);padding:14px;border-radius:16px;border:1px solid var(--line)}
.filters.open{display:grid}
label{display:block;font-size:12px;color:var(--mut);letter-spacing:.5px;margin-bottom:12px}
.filters label{margin:0}
input,select,textarea{width:100%;margin-top:5px;background:#f6f9ff;border:1px solid var(--line);color:var(--cream);padding:12px;border-radius:12px;font:400 15px 'Jost';outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--gold);flex:none}
.chk{display:flex;gap:10px;align-items:flex-start;color:var(--cream);font-size:13.5px;letter-spacing:0}
.btn{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(26,86,219,.28);border:0;border-radius:14px;padding:14px 18px;font:600 15px 'Jost';width:100%;letter-spacing:.4px}
.btn.o{background:#fff;border:1.5px solid var(--gold);color:var(--gold);box-shadow:none}
.row2{display:flex;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 4px 14px rgba(26,86,219,.08)}
.ph{height:130px;background-size:cover;background-position:center;display:grid;place-items:center;font-size:56px}
.card .b{padding:11px}.card h3{font-size:22px;color:var(--gold2);line-height:1}
.card p{font-size:12px;color:var(--mut);margin-top:4px}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:12px;background:#e6f0ff;margin:5px 4px 0 0;color:var(--cream)}
.tag.g{color:var(--ok)}.tag.r{color:var(--bad)}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:-18px -18px 14px}
.gal .ph{min-width:100%;height:300px;scroll-snap-align:center;font-size:110px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.sec h3{font-size:22px;color:var(--gold);margin-bottom:8px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid #e6edf8;font-size:14px}
.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right}
.lock{color:var(--gold);font-size:13px}
nav{display:flex;background:transparent;border-bottom:1px solid var(--line);padding:2px 6px 4px}
nav a{flex:1;text-align:center;color:var(--mut);text-decoration:none;font-size:11px;padding:4px}
nav a b{display:block;font-size:19px;font-weight:400}nav a.on{color:var(--gold2)}
.tabs{display:flex;margin-bottom:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tabs button{flex:1;padding:12px;background:transparent;color:var(--mut);border:0;font:500 15px 'Jost'}.tabs button.on{background:var(--grad);color:#fff}
.warn{background:#fff1f0;border:1px solid #f3c2bf;border-radius:14px;padding:12px;font-size:12.5px;color:#b3372f;margin-bottom:16px;line-height:1.6}
.toast{position:fixed;top:96px;left:50%;transform:translateX(-50%);background:#0b2a6b;color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;font-weight:500;z-index:9;max-width:90%;text-align:center}
.empty{text-align:center;color:var(--mut);padding:30px 0;grid-column:1/-1}
.pct{float:right;background:var(--grad);color:#fff;font-weight:600;border-radius:12px;padding:2px 9px;font-size:12px}
.back{background:none;border:0;color:var(--gold);font:500 14px 'Jost';margin-bottom:10px}
.lb{position:fixed;inset:0;background:#040814;z-index:30;display:flex;align-items:center;justify-content:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb b{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;color:#fff;font-size:30px;width:46px;height:46px;display:grid;place-items:center;background:rgba(255,255,255,.15);border-radius:50%;font-weight:400}
.lb i{position:absolute;top:50%;margin-top:-26px;color:#fff;font-size:40px;font-style:normal;width:44px;height:52px;display:grid;place-items:center;background:rgba(255,255,255,.15)}
.lb i.l{left:6px;border-radius:0 12px 12px 0}.lb i.r{right:6px;border-radius:12px 0 0 12px}
.lb span{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));color:#fff;font-size:14px;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:14px}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(8px)}
</style></head>

const $=s=>document.querySelector(s);
const L=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Storage full – use fewer/smaller photos')}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me=null,TOKEN=L('pa_tok'),P=[];
async function api(p,o={}){const h={'Content-Type':'application/json'};if(TOKEN)h.Authorization='Bearer '+TOKEN;let r;
try{r=await fetch('/api'+p,{method:o.method||(o.body?'POST':'GET'),headers:h,body:o.body?JSON.stringify(o.body):undefined})}catch(e){throw new Error('Cannot reach the server. Check your internet.')}
let j={};try{j=await r.json()}catch(e){}
if(r.status==401&&TOKEN&&p!='/login'){TOKEN=null;me=null;try{localStorage.removeItem('pa_tok')}catch(e){}location.hash='#/login'}
if(!r.ok)throw new Error(j.error||'Server error ('+r.status+')');return j}
const deco=p=>{p.bg=BG[p.id.length%4];return p};
const EM={Dog:'🐶',Cat:'🐱',Rabbit:'🐰',Bird:'🐦',Other:'🐾'};
const BG=['linear-gradient(135deg,#dbe9ff,#bff5ee)','linear-gradient(135deg,#cfe0ff,#e6f0ff)','linear-gradient(135deg,#c9f3ec,#dbe9ff)','linear-gradient(135deg,#e0e7ff,#c6f1ea)'];
const all=()=>P;
const ageTxt=m=>m<12?m+' months':(m%12?Math.floor(m/12)+' yr '+m%12+' mo':m/12+' years');
const grp=m=>m<12?'Puppy':m<36?'Young':m<96?'Adult':'Senior';
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2600)};
let F={},mode='login';

/* ---------- pieces ---------- */
const head=()=>`<header><div class="logo"><img src="${LOGO}" alt="PetVora"></div><div><h1>PetAdopt 🐾</h1><small>by PetVora</small></div></header>`;
const nav=r=>`<nav>${[['','🏠','Home'],['match','💞','Match'],['add','➕','List Pet'],['me','👤','Me']].map(x=>`<a href="#/${x[0]}" class="${(r||'')==x[0]||(x[0]==''&&['pet','apply'].includes(r))?'on':''}"><b>${x[1]}</b>${x[2]}</a>`).join('')}</nav>`;
const NOP=p=>`<div class="ph" style="background:${p.bg};font-size:14px;color:var(--mut)">No photo</div>`;
const img=(p,c='')=>p.photos&&p.photos[0]?`<div class="ph ${c}" style="background-image:url('${p.photos[0]}')"></div>`:NOP(p);
const card=(p,pct)=>`<div class="card" onclick="location.hash='#/pet/${p.id}'">${img(p)}<div class="b"><h3>${esc(p.name)}${pct?`<span class="pct">${pct}%</span>`:''}</h3><p>${esc(p.breed)} • ${p.gender} • ${ageTxt(p.age)}</p><p>📍 ${esc(p.city)}</p><span class="tag ${p.vacc=='Vaccinated'?'g':''}">💉 ${p.vacc=='Vaccinated'?'Vaccinated':p.vacc}</span>${p.kids=='Yes'?'<span class="tag">❤️ Kids</span>':''}${p.fee=='Free'?'<span class="tag">Free</span>':''}</div></div>`;
const kv=(a,b)=>`<div class="kv"><span>${a}</span><span>${esc(b||'—')}</span></div>`;
const opt=(a,sel)=>a.map(x=>`<option ${x==sel?'selected':''}>${x}</option>`).join('');
const sel=(n,l,o)=>`<label>${l}<select name="${n}">${opt(o)}</select></label>`;
const inp=(n,l,t='text',r=0,v='')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${r?'required':''}></label>`;

/* ---------- views ---------- */
function login(){return `<div style="text-align:center;margin-bottom:14px"><div class="logo" style="width:120px;height:120px;margin:0 auto;border-width:3px"><img src="${LOGO}"></div></div><div class="hero"><h2>Give a needy pet a home.</h2><p>Sign in with your Gmail and set your own password.</p></div><div id="err" class="warn" style="display:none"></div>
<div class="tabs"><button type="button" class="${mode=='login'?'on':''}" onclick="mode='login';render()">Login</button><button type="button" class="${mode=='up'?'on':''}" onclick="mode='up';render()">Sign Up</button></div>
<form onsubmit="return false" novalidate>${mode=='up'?inp('name','Your name','text',1)+inp('city','Your city','text',1):''}
${inp('email','Gmail address','email',1)}${inp('pw','Password (min 6 characters)','password',1)}${mode=='up'?inp('pw2','Confirm password','password',1):''}
<button type="button" class="btn" onclick="auth(this.form)">${mode=='up'?'Create Account':'Login'}</button></form>`}
function err(t){const e=$('#err');if(e){e.textContent=t;e.style.display='block';e.scrollIntoView({block:'center'})}else toast(t)}
async function auth(f){const b=f.querySelector('.btn'),d=Object.fromEntries(new FormData(f));const e=(d.email||'').trim().toLowerCase();
if(!/^[^\s@]+@gmail\.com$/.test(e))return err('Please use a Gmail address like name@gmail.com');
if((d.pw||'').length<6)return err('Password must be at least 6 characters');
if(mode=='up'){if(!(d.name||'').trim()||!(d.city||'').trim())return err('Please fill your name and city');if(d.pw!=d.pw2)return err('Both passwords must be the same')}
b.disabled=true;b.textContent='Please wait…';
try{const r=await api(mode=='up'?'/signup':'/login',{body:{name:d.name,city:d.city,email:e,password:d.pw}});TOKEN=r.token;S('pa_tok',TOKEN);me=r.user;mode='login';location.hash='#/';await render()}
catch(x){err(x.message);b.disabled=false;b.textContent=mode=='up'?'Create Account':'Login'}}

function home(){setTimeout(list,0);const br=[...new Set(all().map(p=>p.breed))].sort();
const fs=(k,l,o)=>`<label>${l}<select onchange="F.${k}=this.value;list()"><option value="">Any</option>${o.map(x=>Array.isArray(x)?`<option value="${x[0]}">${x[1]}</option>`:`<option>${x}</option>`).join('')}</select></label>`;
return `<div class="hero"><h2>Find your forever friend</h2><p>Hello ${esc(me.name.split(' ')[0])}! These pets are waiting for a loving home.</p>
<div class="flow"><span>1 List</span><span>2 Apply</span><span>3 Verify</span><span>4 Connect</span><span>5 Adopt</span></div></div>
<div class="chips"><button class="chip on" data-t="" onclick="setT('',this)">All</button>${['Dog','Cat','Rabbit','Bird'].map(t=>`<button class="chip" data-t="${t}" onclick="setT('${t}',this)">${EM[t]} ${t}</button>`).join('')}</div>
<button class="btn o fbtn" onclick="$('.filters').classList.toggle('open')">⚙️ Filters &amp; Sort</button>
<div class="filters"><label>📍 City<input placeholder="e.g. Nashik" oninput="F.city=this.value;list()"></label>
${fs('age','Age',['Puppy','Young','Adult','Senior'])}${fs('gender','Gender',['Male','Female'])}${fs('size','Size',['Small','Medium','Large'])}${fs('breed','Breed',br)}
${fs('good','Good with',[['kids','Children'],['dogs','Dogs'],['cats','Cats']])}${fs('vacc','Vaccinated',['Yes','No'])}${fs('fee','Adoption fee',['Free','Paid'])}
<label style="grid-column:1/-1">Sort<select onchange="F.sort=this.value;list()"><option>Newest</option><option>Nearest</option><option>Recently updated</option></select></label></div>
<p style="color:var(--mut);font-size:13px;margin-bottom:10px"><span id="cnt"></span> pets available</p><div class="grid" id="list"></div>`}
function setT(t,b){F.type=t;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c==b));list()}
function list(){const el=$('#list');if(!el)return;let a=all().filter(p=>(!F.type||p.type==F.type)&&(!F.city||p.city.toLowerCase().includes(F.city.toLowerCase()))&&(!F.age||grp(p.age)==F.age)&&(!F.gender||p.gender==F.gender)&&(!F.size||p.size==F.size)&&(!F.breed||p.breed==F.breed)&&(!F.good||p[F.good]=='Yes')&&(!F.vacc||(F.vacc=='Yes')==(p.vacc=='Vaccinated'))&&(!F.fee||(F.fee=='Free')==(p.fee=='Free')));
if(F.sort=='Nearest')a.sort((x,y)=>(y.city.toLowerCase()==me.city.toLowerCase())-(x.city.toLowerCase()==me.city.toLowerCase()));
else if(F.sort=='Recently updated')a.sort((x,y)=>(y.updated||y.created)-(x.updated||x.created));else a.sort((x,y)=>y.created-x.created);
el.innerHTML=a.map(p=>card(p)).join('')||'<p class="empty">No pets match these filters 🐾</p>';$('#cnt').textContent=a.length}

async function pet(id){let p;try{p=deco((await api('/pets/'+id)).pet)}catch(e){return '<button class="back" onclick="history.back()">← Back</button><p class="empty">Pet not found</p>'}
const ap=p.myApp;
PH=p.photos;const g=(p.photos.length?p.photos.map((x,i)=>`<div class="ph" onclick="zoom(${i})" style="background-image:url('${x}');cursor:zoom-in"></div>`).join(''):NOP(p).replace('class="ph"','class="ph" style="height:300px"'));
return `<div class="gal">${g}</div>${p.photos.length?'<p style="color:var(--mut);font-size:12px;text-align:center;margin:-6px 0 10px">Tap a photo to view full screen</p>':''}<button class="back" onclick="history.back()">← Back</button>
<h2 style="font-size:38px;color:var(--gold2)">${esc(p.name)}</h2>
<p style="color:var(--mut);margin:4px 0 8px">${esc(p.breed)} • ${p.gender} • ${ageTxt(p.age)} • ${p.size}</p>
<span class="tag">📍 ${esc(p.city)}${p.area?', '+esc(p.area):''}</span><span class="tag ${p.vacc=='Vaccinated'?'g':''}">💉 ${p.vacc}</span><span class="tag">${p.fee=='Free'?'Free adoption':p.fee}</span>
<div class="sec" style="margin-top:14px"><h3>About ${esc(p.name)}</h3><p style="font-size:14.5px;line-height:1.6">${esc(p.desc)}</p></div>
<div class="sec"><h3>Basics</h3>${kv('Pet type',p.type)}${kv('Breed',p.breed)}${kv('Age',ageTxt(p.age))}${kv('Gender',p.gender)}${kv('Weight',p.weight)}${p.video?kv('Video',p.video):''}</div>
<div class="sec"><h3>Health</h3>${kv('Vaccination',p.vacc)}${kv('Vaccination details',p.vaccDetail)}${kv('Dewormed',p.deworm)}${kv('Spayed / Neutered',p.sterile)}${kv('Current condition',p.health)}${kv('Medical conditions',p.medical)}${kv('Medications',p.meds)}${kv('Vet records',p.vet||'Not uploaded')}</div>
<div class="sec"><h3>Personality &amp; Behaviour</h3>${kv('Personality',p.energy)}${kv('Good with children',p.kids)}${kv('Good with dogs',p.dogs)}${kv('Good with cats',p.cats)}${kv('House-trained',p.house)}${kv('Leash-trained',p.leash)}${kv('Around strangers',p.strangers)}${kv('Special needs',p.special)}${kv('Favourite things',p.fav)}</div>
<div class="sec"><h3>Adoption Details</h3>${kv('Reason for rehoming',p.reason)}${kv('Location',p.city+(p.area?', '+p.area:''))}${kv('Available from',p.from)}${kv('Adoption fee',p.fee=='Free'?'Free':(p.feeAmt||p.fee))}${kv('Listed by',p.relation)}${kv('Verification',p.verified?'✅ Verified':'⏳ Pending review')}</div>
${p.contact?`<div class="sec"><h3>Lister Contact</h3>${kv('Name',p.contact.name)}${kv('Phone',p.contact.phone)}${kv('Email',p.contact.email)}${kv('Prefers',p.contact.cm)}</div>`:`<div class="sec"><h3>Lister Contact</h3><p class="lock">🔒 Exact address, phone &amp; email are shared only after your adoption request is verified and accepted.</p></div>`}
${ap?`<div class="sec"><h3>Your request</h3><p>Status: <b style="color:var(--gold2)">${ST[ap.status]}</b></p></div>`:''}
${p.mine?'<p class="lock">This is your listing.</p>':`<div class="row2"><button class="btn" ${ap?'disabled style="opacity:.6"':''} onclick="location.hash='#/apply/${p.id}'">${ap?'Request sent':'❤️ Adopt '+esc(p.name)}</button><button class="btn o" onclick="toast('${p.contact?'Contact details are shown above':ap?'Contact opens after approval':'Send an adoption request first'}')">💬 Contact</button></div>`}`}

function apply(id){const p=all().find(x=>x.id==id);if(!p)return '';
return `<button class="back" onclick="history.back()">← Back</button><h2 style="font-size:32px;color:var(--gold2)">Adopt ${esc(p.name)}</h2><p style="color:var(--mut);font-size:13px;margin:6px 0 16px">Our team verifies every request before connecting you with the lister.</p>
<form onsubmit="return false">${inp('name','Full name','text',1,me.name)}${inp('phone','Phone number','tel',1)}${inp('email','Email','email',1,me.email)}${inp('city','City','text',1,me.city)}
${sel('home','Home type',['Apartment','Independent house','Farmhouse / large space','Rented home'])}${sel('exp','Experience with pets',['First-time owner','Some experience','Experienced'])}
${sel('exist','Existing pets',['None','Dog','Cat','Other pets'])}${sel('kids','Children at home',['No','Yes'])}
<label>Why do you want to adopt?<textarea name="why" required></textarea></label>
<label class="chk"><input type="checkbox" required>I agree to provide proper food, vet care, safety and lifelong love.</label><br>
<label class="chk"><input type="checkbox" required>My details are true and I agree to the adoption &amp; privacy rules.</label><br><button type="button" class="btn" onclick="sendApp(this.form,'${p.id}')">Send Adoption Request</button></form>`}
async function sendApp(f,id){if(!f.reportValidity())return;const b=f.querySelector('.btn');b.disabled=true;
try{await api('/apply',{body:{petId:id,...Object.fromEntries(new FormData(f))}});toast('Request sent! We will verify and connect you 🐾');location.hash='#/pet/'+id}catch(x){toast(x.message);b.disabled=false}}

function add(){const Y=['Yes','No','Unknown'];
return `<h2 style="font-size:32px;color:var(--gold2);margin-bottom:12px">List a Pet for Adoption</h2>
<div class="warn"><b>Not allowed:</b><br>❌ Protected / wild animals &nbsp;❌ Illegal animal trading<br>❌ Animals obtained illegally &nbsp;❌ Cruelty-promoting listings<br>❌ Fake health / vaccination claims<br>❌ Unverified breeders selling animals<br>❌ Exact home address in public</div>
<form onsubmit="return false"><div class="sec"><h3>Basics</h3>${inp('name','Pet name','text',1)}${sel('type','Pet type',['Dog','Cat','Rabbit','Bird','Other'])}${inp('breed','Breed','text',1)}
<div class="row2">${inp('ay','Age (number)','number',1)}${sel('au','Unit',['months','years'])}</div>${sel('gender','Gender',['Male','Female'])}${sel('size','Size',['Small','Medium','Large'])}${inp('weight','Weight (optional)')}
<label>Real photos of the pet (at least 1 – 3 to 5 clear photos is best)<input type="file" id="ph" accept="image/*" multiple required></label>${inp('video','Video link (optional)')}</div>
<div class="sec"><h3>Health</h3>${sel('vacc','Vaccination status',['Vaccinated','Partially vaccinated','Not vaccinated','Unknown'])}${inp('vaccDetail','Vaccination details (optional)')}${sel('deworm','Dewormed?',Y.reverse().reverse())}${sel('sterile','Spayed / Neutered?',['Unknown','Yes','No'])}
<label>Current health condition (choose Unknown if not sure)<select name="hsel"><option>Unknown / Not sure</option><option>Checked by a vet – good</option><option>Needs care</option></select></label>${inp('medical','Any medical conditions?','text',0,'Unknown')}${inp('meds','Current medications?','text',0,'None')}
<label>Veterinary records (optional)<input type="file" id="vet"></label></div>
<div class="sec"><h3>Behaviour</h3>${sel('energy','Personality',['Calm','Friendly','Playful','Energetic','Shy','Protective'])}${sel('kids','Good with children?',['Unknown','Yes','No'])}${sel('dogs','Good with other dogs?',['Unknown','Yes','No'])}${sel('cats','Good with cats?',['Unknown','Yes','No'])}
${sel('house','House-trained?',['Unknown','Yes','No'])}${sel('leash','Leash-trained?',['Unknown','Yes','No'])}${sel('strangers','Comfortable around strangers?',['Unknown','Yes','No'])}${inp('special','Special behaviour / needs')}${inp('fav','Favourite activities / toys')}
<label>Short description<textarea name="desc" required></textarea></label></div>
<div class="sec"><h3>Adoption &amp; Contact</h3><label>Reason for rehoming<textarea name="reason" required></textarea></label>${inp('city','City','text',1,me.city)}${inp('area','Area / Pincode (no exact address)','text',1)}${inp('from','Available from','date',1)}
${sel('fee','Adoption fee',['Free','Fee','Contact for details'])}${inp('feeAmt','Fee amount (if any)')}${inp('lname','Your name','text',1,me.name)}${inp('phone','Phone number','tel',1)}${inp('email','Email','email',1,me.email)}${sel('cm','Preferred contact method',['Phone','WhatsApp','Email'])}${sel('relation','Relationship to pet',['Owner','Rescuer','Shelter','Volunteer'])}
<p class="lock">Verification status: ⏳ Pending – our team reviews every listing.</p></div>
<div class="sec"><h3>Adoption Agreement</h3>${['I confirm that I have the right to list this pet for adoption.','The information provided is accurate to the best of my knowledge.','I understand the platform may review/remove misleading listings.','I agree to the adoption and privacy rules.','This is NOT a wild/protected animal and I am not selling it for profit.'].map(t=>`<label class="chk"><input type="checkbox" required>${t}</label><br>`).join('')}</div>
<button type="button" class="btn" onclick="savePet(this.form)">Submit for Review</button></form>`}
const rs=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,800/i.width);c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};i.src=fr.result};fr.readAsDataURL(f)});
async function savePet(f){if(!f.reportValidity())return;const b=f.querySelector('.btn');b.disabled=true;b.textContent='Submitting…';
try{const d=Object.fromEntries(new FormData(f));const photos=await Promise.all([...$('#ph').files].slice(0,5).map(rs));const v=$('#vet').files[0];
const r=await api('/pets',{body:{...d,photos,vet:v?v.name:''}});toast('Listing submitted for review ✅');location.hash='#/pet/'+r.pet.id}
catch(x){toast(x.message);b.disabled=false;b.textContent='Submit for Review'}}

function match(){return `<h2 style="font-size:32px;color:var(--gold2)">Find Your Perfect Pet 💞</h2><p style="color:var(--mut);font-size:13px;margin:6px 0 16px">Answer a few questions and we will suggest the best matches.</p>
<form onsubmit="return false">${sel('type','Which pet?',['Any','Dog','Cat','Rabbit','Bird'])}${sel('home','Where do you live?',['Apartment','House'])}${sel('kids','Do you have children?',['No','Yes'])}${sel('pets','Do you have other pets?',['None','Dog','Cat'])}
${sel('energy','What kind of pet do you want?',['Calm','Playful','Energetic'])}${sel('hours','Time you can give daily',['Less than 1 hour','1–2 hours','3+ hours'])}<button type="button" class="btn" onclick="doMatch(this.form)">Show My Matches</button></form><div id="res" style="margin-top:20px"></div>`}
function doMatch(f){const a=Object.fromEntries(new FormData(f)),lv={Calm:0,Playful:1,Energetic:2},h={'Less than 1 hour':0,'1–2 hours':1,'3+ hours':2};
const r=all().filter(p=>a.type=='Any'||p.type==a.type).map(p=>{let s=55;
if(a.home=='Apartment'){s+=p.size=='Small'?12:p.size=='Medium'?5:-10}
if(a.kids=='Yes')s+=p.kids=='Yes'?15:p.kids=='No'?-40:-8;
if(a.pets=='Dog')s+=p.dogs=='Yes'?12:p.dogs=='No'?-40:-5;
if(a.pets=='Cat')s+=p.cats=='Yes'?12:p.cats=='No'?-40:-5;
const dif=Math.abs((lv[p.energy]??1)-lv[a.energy]);s+=dif==0?15:dif==2?-15:0;
if((lv[p.energy]??1)>h[a.hours]+1)s-=15;
return{p,s:Math.max(5,Math.min(99,s))}}).sort((x,y)=>y.s-x.s);
$('#res').innerHTML='<h3 style="font-size:26px;color:var(--gold)">Your matches</h3><br><div class="grid">'+(r.map(x=>card(x.p,x.s)).join('')||'<p class="empty">No pets yet</p>')+'</div>';$('#res').scrollIntoView({behavior:'smooth'});return false}

const ST={'Pending verification':'⏳ Pending platform verification','Verified':'✅ Verified – waiting for lister','Accepted':'🎉 Accepted – contact shared','Declined':'Declined by lister','Rejected':'Rejected by platform'};
async function act(u,b){try{await api(u,{body:b});toast('Done ✅');render()}catch(x){toast(x.message)}}
async function profile(){const r=await api('/my'),ad=me.admin?await api('/admin'):null;
const inc=a=>`<div class="sec"><b>${esc(a.petName)}</b> ← ${esc(a.name)} (${esc(a.city)})<br><span style="color:var(--mut);font-size:13px">${esc(a.home)} • ${esc(a.exp)} • Pets: ${esc(a.exist)} • Kids: ${esc(a.kids)}</span><p style="font-size:14px;margin:6px 0">${esc(a.why)}</p><p class="lock">${ST[a.status]}</p>
${a.status=='Verified'?`<div class="row2"><button class="btn" onclick="act('/apps/${a.id}/decision',{accept:true})">Accept</button><button class="btn o" onclick="act('/apps/${a.id}/decision',{accept:false})">Decline</button></div>`:''}
${a.status=='Accepted'?`<p style="margin:6px 0">📞 ${esc(a.phone)} • ✉️ ${esc(a.email)}</p>${a.adopted?'<p class="lock">🏠 Adopted</p>':`<button class="btn" onclick="act('/pets/${a.petId}/adopted',{})">Mark ${esc(a.petName)} as adopted 🎉</button>`}`:''}</div>`;
const adm=ad?`<h3 style="font-size:24px;color:var(--gold);margin-bottom:10px">🛡️ Platform verification</h3>
${ad.listings.map(p=>`<div class="sec"><b>${esc(p.name)}</b> • ${esc(p.type)} • ${esc(p.breed)} • ${ageTxt(p.age)}<br><span style="color:var(--mut);font-size:13px">📍 ${esc(p.city)}, ${esc(p.area)} • ${esc(p.relation)}<br>Vaccination: ${esc(p.vacc)} • ${esc(p.contact.name)} ${esc(p.contact.phone)} ${esc(p.contact.email)}</span><p style="font-size:14px;margin:6px 0">${esc(p.desc)}</p><div class="row2"><button class="btn" onclick="act('/admin/listing',{id:'${p.id}',ok:true})">Approve</button><button class="btn o" onclick="act('/admin/listing',{id:'${p.id}',ok:false})">Reject</button></div></div>`).join('')||'<p style="color:var(--mut);margin-bottom:12px">No listings waiting</p>'}
${ad.apps.map(a=>`<div class="sec"><b>${esc(a.petName)}</b> ← ${esc(a.name)}, ${esc(a.city)}<br><span style="color:var(--mut);font-size:13px">${esc(a.phone)} • ${esc(a.email)}<br>${esc(a.home)} • ${esc(a.exp)} • Pets: ${esc(a.exist)} • Kids: ${esc(a.kids)}</span><p style="font-size:14px;margin:6px 0">${esc(a.why)}</p><div class="row2"><button class="btn" onclick="act('/admin/app',{id:'${a.id}',ok:true})">Verify</button><button class="btn o" onclick="act('/admin/app',{id:'${a.id}',ok:false})">Reject</button></div></div>`).join('')||'<p style="color:var(--mut);margin-bottom:20px">No requests waiting</p>'}`:'';
return `<div class="hero"><h2>${esc(me.name)}</h2><p>${esc(me.email)} • 📍 ${esc(me.city)}${me.admin?' • 🛡️ Admin':''}</p></div>${adm}
<h3 style="font-size:24px;color:var(--gold);margin-bottom:10px">My listings</h3><p style="color:var(--mut);font-size:12px;margin-bottom:8px">New listings go live after platform approval.</p><div class="grid" style="margin-bottom:20px">${r.listings.map(p=>card(deco(p))).join('')||'<p class="empty">No listings yet</p>'}</div>
<h3 style="font-size:24px;color:var(--gold);margin-bottom:10px">Requests for my pets</h3>${r.incoming.map(inc).join('')||'<p style="color:var(--mut);margin-bottom:16px">None yet</p>'}
<h3 style="font-size:24px;color:var(--gold);margin:10px 0">My adoption requests</h3>${r.mine.map(a=>`<div class="sec" onclick="location.hash='#/pet/${a.petId}'">${esc(a.petName)} — <b style="color:var(--gold2)">${ST[a.status]}</b></div>`).join('')||'<p style="color:var(--mut);margin-bottom:16px">None yet</p>'}
<button class="btn o" onclick="mode='login';me=null;TOKEN=null;try{localStorage.removeItem('pa_tok')}catch(e){};location.hash='#/login';render()">Logout</button>`}

/* ---------- full-screen photo ---------- */
let LBi=0,PH=[];
function zoom(i){LBi=i;closeLb();const d=document.createElement('div');d.className='lb';d.id='lb';
d.innerHTML='<b onclick="closeLb()">✕</b><img id="lbi" alt="">'+(PH.length>1?'<i class="l" onclick="lbGo(-1)">‹</i><i class="r" onclick="lbGo(1)">›</i><span id="lbc"></span>':'');
d.onclick=e=>{if(e.target==d)closeLb()};let x0=0;d.ontouchstart=e=>{x0=e.touches[0].clientX};d.ontouchend=e=>{const dx=e.changedTouches[0].clientX-x0;if(PH.length>1&&Math.abs(dx)>50)lbGo(dx<0?1:-1)};
document.body.append(d);lbShow()}
function lbShow(){$('#lbi').src=PH[LBi];const c=$('#lbc');if(c)c.textContent=(LBi+1)+' / '+PH.length}
function lbGo(n){LBi=(LBi+n+PH.length)%PH.length;lbShow()}
function closeLb(){const d=$('#lb');if(d)d.remove()}
addEventListener('keydown',e=>{if(e.key=='Escape')closeLb();if($('#lb')&&PH.length>1){if(e.key=='ArrowRight')lbGo(1);if(e.key=='ArrowLeft')lbGo(-1)}});

/* ---------- router ---------- */
let busy=0;
async function render(){closeLb();const t=++busy,[r,id]=(location.hash.slice(2)||'').split('/');
if(!me&&r!='login'){location.hash='#/login';return}
if(me&&r=='login'){location.hash='#/';return}
if(me&&r!='add'){try{P=(await api('/pets')).pets.map(deco)}catch(e){if(!me)return}}
const v={'':home,pet,add,match,me:profile,apply,login}[r]||home;let h;
try{h=await v(id)}catch(x){h='<p class="empty">'+esc(x.message)+'</p>'}
if(t!=busy)return;$('#app').innerHTML='<div class="top">'+head()+(me?nav(r):'')+'</div><main>'+h+'</main>';window.scrollTo(0,0)}
addEventListener('hashchange',render);
(async()=>{if(TOKEN){try{me=(await api('/me')).user}catch(e){}}render()})();
</script></body></html>
